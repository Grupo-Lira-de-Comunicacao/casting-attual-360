name: Promotion Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Git SHA to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promotion-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Validate promotion candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.candidate_sha }}" ]]; then
            echo "sha=${{ inputs.candidate_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0

      - name: Verify checked out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"

      - name: Migration safety
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=50
          python3 scripts/check_migration_safety.py --base-ref origin/main

      - name: Promotion manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .promotion
          cat > .promotion/candidate.json <<JSON
          {
            "candidate_sha": "$(git rev-parse HEAD)",
            "source": "github",
            "technical_gate": "passed",
            "ci_required_separately": true,
            "production_promoted": false,
            "mode": "enforcement"
          }
          JSON
          cat .promotion/candidate.json

      - name: Summary
        shell: bash
        run: |
          {
            echo "## ATLAS Promotion Gate"
            echo ""
            echo "Candidate: \`${{ steps.candidate.outputs.sha }}\`"
            echo ""
            echo "Promotion-specific validation passed. CI remains a separate mandatory check for lint, typecheck, tests and build."
            echo ""
            echo "This workflow does **not** deploy production."
          } >> "$GITHUB_STEP_SUMMARY"
