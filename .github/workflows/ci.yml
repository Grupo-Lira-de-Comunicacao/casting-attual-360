name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/fase-1-home
      - codex/fase-2-evolucao-visual
      - codex/fase-3-formularios-supabase

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout 180s npm ci --prefer-offline --no-audit --no-fund; then
              exit 0
            fi
            if [[ "$attempt" -eq 1 ]]; then
              echo "npm ci failed or timed out; verifying cache before one retry"
              npm cache verify || true
              sleep 5
            fi
          done
          echo "npm ci failed after two bounded attempts"
          exit 1

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build
